name: CI

# Runs the full verification matrix on every push and pull request. The
# browser tier is mandatory and not optional: Phases 1–8 shipped 2,584 green
# unit tests over three defects that only a real browser against a real
# database could see, which is the entire reason the end-to-end harness exists.
#
# Three jobs run in parallel. `checks` and `database` are fast; `browser`
# stands up the Docker-free stack (real PostgreSQL + the real PostgREST binary
# + the auth shim + the production Next build) and drives Playwright over it.

on:
  push:
    branches: ['**']
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # Static checks + unit/integration + money audit + secret scan + build.
  # No database required.
  # --------------------------------------------------------------------------
  checks:
    name: checks, unit/integration, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the secret scan sees every commit

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: |
          if ! npm run format:check; then
            npm run format
            git diff -- .
            exit 1
          fi

      - name: Unit and integration tests
        run: npm run test:run

      - name: Money arithmetic audit
        run: npm run audit:money

      - name: Secret scan (source + full history)
        run: |
          # Fail if a real secret key, private key or database URL is committed.
          # Harness/example/placeholder values are allowed.
          if git log -p --all \
            | grep -inE "sb_secret_[a-z0-9]{10}|BEGIN (RSA )?PRIVATE KEY|service_role_key\s*[:=]\s*[\"'][a-z0-9]{20}" \
            | grep -vicE "harness|example|placeholder|test" | grep -q '[1-9]'; then
            echo "::error::A secret-like value was found in the repository history."
            exit 1
          fi
          echo "No committed secrets found."

      - name: Dependency audit
        # Reject high-severity advisories in production and development tools.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          LOG_LEVEL: error

      - name: No secret in client bundle
        run: |
          if grep -rlE "sb_secret_|SUPABASE_SECRET_KEY|service_role|BEGIN (RSA )?PRIVATE KEY" .next/static 2>/dev/null; then
            echo "::error::A secret pattern was found in the built client bundle."
            exit 1
          fi
          echo "Client bundle is free of secret patterns."

      - name: Browser bundle assertions (needs the build)
        # `tests/integration/bundle.test.ts` skips itself when `.next/static`
        # is absent, so a developer running the suite alone is not told their
        # tests are broken. The consequence in CI was that its six assertions
        # never ran at all: the unit/integration step above executes before the
        # production build, so the directory did not yet exist and the file
        # reported itself skipped. That silently dropped the claim that no
        # Supabase client runtime reaches the browser, and the gzipped size
        # budgets with it.
        #
        # Re-run it here, where `.next/static` exists. The guard is the point:
        # without it a future reordering would put the skip back and CI would
        # stay green while asserting nothing.
        run: |
          test -d .next/static/chunks || {
            echo "::error::.next/static/chunks is missing, so the bundle suite would skip rather than assert."
            exit 1
          }
          npx vitest run --project integration tests/integration/bundle.test.ts

  # --------------------------------------------------------------------------
  # Database suite: real PostgreSQL, every migration applied from zero, then
  # the schema/RLS/constraint/concurrency tests.
  # --------------------------------------------------------------------------
  database:
    name: database (real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Put PostgreSQL binaries on PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"

      - name: Build a local throwaway cluster and apply every migration
        run: npm run db:local:setup

      # `test:db` runs four vitest projects in sequence: the database suite,
      # the demonstration seeder's, the borrower-reuse one, then the member
      # loan demonstration's. The seeder's is separate because the policy
      # version it publishes is global state that would collide with every
      # membership suite. Borrower reuse is separate again because it needs a
      # database the synthetic seeder has never touched — once those six fee
      # and deposit keys are spent on synthetic clients, reuse correctly
      # refuses to remap them. The member loan one is separate for both
      # reasons at once: it publishes version 998.0 as the only version in
      # force, and it reuses borrowers. See the header of vitest.config.mts.
      # Each project's own globalSetup rebuilds the cluster the previous step
      # created, so this one step covers all four.
      - name: Database tests, the seeders, borrower reuse, member loans
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://lending@localhost:5433/lending_test
          # `POLYTOS_SEED_DEMO` is deliberately **not** set here, and neither
          # is `POLYTOS_SEED_MEMBER_LOANS`. The seeder refuses without them,
          # and each suite supplies the phrase per child process — which is
          # also how they can assert the refusals. Putting either in this
          # job's environment would hand it to every other step for no gain.

      - name: Upgrade and existing-borrower demo integration
        run: node scripts/verify-membership-upgrade.mjs

      - name: Upload policy financial reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polytos-policy-financial-reconciliation
          path: work/policy-upgrade-financial-report.json
          if-no-files-found: ignore
          retention-days: 30

  # --------------------------------------------------------------------------
  # Browser suite: the production build driven by Playwright against the
  # Docker-free stack, on a freshly seeded database. Fixture IDs are generated
  # by the seed on every run; the manifest is never restored mid-run (the
  # seed-hygiene rule that an earlier manual run violated).
  # --------------------------------------------------------------------------
  browser:
    name: browser E2E (production build, fresh seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Put PostgreSQL binaries on PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"

      - name: Install the real PostgREST binary
        run: |
          mkdir -p .e2e
          curl -sSL -o .e2e/pgrst.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -C .e2e -xf .e2e/pgrst.tar.xz
          chmod +x .e2e/postgrest

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bring up the stack (migrate, seed, build, serve)
        run: bash tests/e2e/harness/stack.sh up

      # The stack is brought up by the previous step. Each `run:` is its own
      # shell, and a service started in one step can be gone by the next — the
      # runner signals the step's process group at step end, which `nohup`
      # does not escape (`stack.sh` now uses `setsid`, which does). When the
      # browser suite failed in CI with four `auth.setup.ts` timeouts and 519
      # specs "did not run", the job's own cleanup listed only `postgres` as an
      # orphan: everything else was already dead. This step says so in one
      # line, in the right place, instead of leaving it to be inferred.
      - name: The stack is still up
        run: |
          source <(bash tests/e2e/harness/stack.sh env)
          E2E_POSTGREST_URL="http://127.0.0.1:3001" node tests/e2e/harness/verify.mjs

      - name: Browser tests
        run: |
          source <(bash tests/e2e/harness/stack.sh env)
          npx playwright test

      # ----------------------------------------------------------------
      # The delivery evidence for Polytos Phase 4.
      #
      # `scripts/capture-benefit-screens.mjs` photographs nineteen screens at
      # four viewports, plus two screens that need a role other than the
      # Owner, and writes a timing table beside them. It asserts nothing — the
      # assertions are the suite above — and it writes no data, so it is safe
      # here, after the tests, on the same seeded stack.
      #
      # It runs in CI rather than locally because it needs the real PostgREST
      # binary and a Chromium, and the authoring container could fetch
      # neither. `if: success()` because a screenshot taken after a failing
      # suite would be evidence of nothing; the Playwright artifact below
      # covers that case instead. It reuses the storage states the suite's
      # `auth.setup.ts` wrote, which is why it cannot run before it.
      - name: Capture the Phase 4 screens
        if: success()
        run: |
          source <(bash tests/e2e/harness/stack.sh env)
          node scripts/capture-benefit-screens.mjs

      - name: Upload the Phase 4 screens
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polytos-phase-4-screens
          # The PNGs and `timings.json` only — never `.e2e/state/`, which
          # holds the harness's session cookies.
          path: .e2e/shots/benefits/
          retention-days: 30
          if-no-files-found: error

      - name: Tear down the stack
        if: always()
        run: bash tests/e2e/harness/stack.sh down || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Traces, screenshots and the HTML report — never the harness logs,
          # which would carry the synthetic-but-local credentials.
          path: |
            .e2e/playwright/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  security-release-rehearsal:
    name: security release rehearsal (PostgreSQL 17, real Auth)
    runs-on: ubuntu-latest
    env:
      PGLOCAL_BIN: /usr/lib/postgresql/17/bin
      E2E_POSTGREST: ${{ github.workspace }}/.e2e/postgrest
      E2E_REAL_AUTH_BINARY: ${{ github.workspace }}/.e2e/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 17
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/postgresql.asc >/dev/null
          . /etc/os-release
          printf 'deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Install pinned real Auth and PostgREST
        run: |
          mkdir -p .e2e
          curl -fsSL https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz -o .e2e/auth.tar.xz
          printf '%s  %s\n' b5c2991d1df760c9b099c1c2395a94bd1c2f83ed58901934921997179dc9f7ea .e2e/auth.tar.xz | sha256sum -c -
          tar -xJf .e2e/auth.tar.xz -C .e2e
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C .e2e
      - run: npm run db:local:setup
      - name: Scoped migration, hook reload and interruption rehearsal
        run: node scripts/rehearse-security-release.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start isolated real Auth stack
        run: bash tests/e2e/harness/stack.sh up
      - name: Real recovery and two-tab renewal past JWT expiry
        run: |
          source <(bash tests/e2e/harness/stack.sh env)
          npx playwright test tests/e2e/specs/real-auth.release.spec.ts --project=desktop
      - name: Stop isolated stack
        if: always()
        run: bash tests/e2e/harness/stack.sh down || true
