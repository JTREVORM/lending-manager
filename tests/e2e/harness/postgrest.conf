# ===========================================================================
# PostgREST, for the end-to-end harness. Placeholders are substituted by
# stack.sh; nothing in this file is a secret, and nothing in it reaches a
# hosted project.
# ===========================================================================
db-uri = "@DB_URI@"
db-schemas = "public"
db-anon-role = "anon"
db-pool = 10
server-host = "127.0.0.1"
server-port = @PORT@
jwt-secret = "harness-only-jwt-secret-not-a-real-key-32+"
jwt-role-claim-key = ".role"
db-extra-search-path = "public"
log-level = "error"
